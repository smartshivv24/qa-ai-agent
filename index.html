<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QA Test Case Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    p.subtitle {
      color: #666;
      margin-bottom: 24px;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #4f46e5;
    }

    button {
      margin-top: 16px;
      width: 100%;
      padding: 14px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #4338ca;
    }

    button:disabled {
      background-color: #a5b4fc;
      cursor: not-allowed;
    }

    #output {
      margin-top: 32px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.7;
      color: #1a1a1a;
      display: none;
    }

    .loader {
      text-align: center;
      margin-top: 20px;
      color: #4f46e5;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 QA Test Case Generator</h1>
    <p class="subtitle">Describe any feature — get structured test cases instantly.</p>

    <textarea 
      id="featureInput" 
      placeholder="e.g. Login page with email and password fields...">
    </textarea>

    <button id="generateBtn">
    Generate Test Cases
    </button>

    <div class="loader" id="loader">⏳ Generating test cases...</div>

    <div id="output"></div>
  </div>

  <script>
  async function generateTestCases() {
    const input = document.getElementById("featureInput").value.trim();
    const output = document.getElementById("output");
    const loader = document.getElementById("loader");
    const btn = document.getElementById("generateBtn");

    if (!input) {
      alert("Please describe a feature first.");
      return;
    }

    // Show loader, disable button
    loader.style.display = "block";
    output.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Generating...";

    const response = await fetch("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: input })
    });

    const data = await response.json();
    const result = data.result;

    // Show result
    loader.style.display = "none";
    output.style.display = "block";
    output.textContent = result;

    // Reset button
    btn.disabled = false;
    btn.textContent = "Generate Test Cases";
  }

  // 👇 This must be OUTSIDE the function
  document.getElementById("generateBtn").addEventListener("click", generateTestCases);
</script>
</body>
</html>
